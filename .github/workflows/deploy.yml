# Production deploy (PLAN §15): on a version tag (or manual dispatch), ask the
# server to build the exact commit this workflow ran for. Afterwards the app's
# health endpoint must come back up, checked on the box at its loopback bind
# (Cloudflare Bot Fight Mode 403s the runner, so the public URL can't be polled
# from CI).
#
# The deploy key is restricted to a forced command, so the steps themselves live
# in ops/deploy/muster-deploy.sh on the server. This workflow can only call
# `deploy <sha>` and `health`; see "Deploy key" in docs/deploy.md.
#
# Rollback: run this workflow by hand and enter the tag to return to. Tagging an
# older commit won't work if that commit predates the forced command, because a
# tag push runs the workflow from the tagged commit.
#
# Required repository secrets:
#   DEPLOY_HOST         — server hostname or IP
#   DEPLOY_USER         — SSH user that owns the rootless Docker daemon
#   DEPLOY_SSH_KEY      — private key for that user (a dedicated deploy key)
#   DEPLOY_KNOWN_HOSTS  — optional; `ssh-keyscan <host>` output to pin the host
#                         key (falls back to scanning at deploy time if unset)
#
# Server prerequisites (one-time): the clone at /opt/muster with a fetchable
# `origin`, and the production `.env` beside compose.yaml (see .env.example).

name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to deploy, e.g. v1.40. Leave blank for the selected branch's commit."
        required: false
        type: string

permissions:
  contents: read

# Never run two deploys at once; let a queued one wait, not cancel a live one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Choose commit
        id: target
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        # Resolve to a SHA here (tags can be moved; SHAs can't). The server only
        # accepts a full SHA that is on main.
        run: |
          if [ -z "$VERSION" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$VERSION" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Not a version tag: $VERSION" >&2
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$VERSION" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Deploy commit on server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ steps.target.outputs.sha }}
        run: ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_USER@$HOST" deploy "$SHA"

      - name: Verify health endpoint
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        # Probe the app on the box at its loopback bind (127.0.0.1:3000), not the
        # public URL: Cloudflare Bot Fight Mode 403s the GitHub runner, and it
        # can't be scoped per-path on the free plan. The loopback check tests the
        # thing that matters here anyway (did the new container come up); the host
        # Apache proxies the same 127.0.0.1:3000, so a healthy loopback means the
        # edge serves too.
        run: ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_USER@$HOST" health
