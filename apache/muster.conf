# muster.hauge.rocks — host Apache vhost, reverse-proxying to the Muster app
# container (published loopback-only on 127.0.0.1:3000 by compose.yaml). The
# box-wide Apache owns 80/443 and TLS for all sites; this stack has no proxy
# container of its own.
#
# Install (Ubuntu, run in this order so configtest never sees missing certs):
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#   sudo certbot certonly --apache -d muster.hauge.rocks    # issue cert first
#   sudo cp apache/muster.conf /etc/apache2/sites-available/muster.conf
#   sudo a2ensite muster && sudo apachectl configtest && sudo systemctl reload apache2
#
# Note: if a global/virtual-host LimitRequestBody is configured, it must allow
# at least 16 MB — proof uploads are up to 15 MB (drive/upload-validation.ts).

<VirtualHost *:80>
    ServerName muster.hauge.rocks
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://muster.hauge.rocks%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName muster.hauge.rocks

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/muster.hauge.rocks/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/muster.hauge.rocks/privkey.pem

    # The app must see the original Host and an https scheme: Auth.js builds
    # callback URLs from them, and Next's server actions verify Origin == Host.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Security headers, owned at the edge (moved from the former Caddyfile).
    # frame-ancestors 'self' blocks clickjacking while still allowing the
    # same-origin PDF proof lightbox iframe.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "frame-ancestors 'self'"
</VirtualHost>
