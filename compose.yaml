# Production stack for muster.hauge.rocks (Ubuntu 24 + Docker).
# Bring up with: docker compose up -d --build
# Secrets come from a .env file next to this compose file (see .env.example).
#
# TLS/proxy: the HOST's Apache terminates HTTPS for all sites on this box and
# reverse-proxies muster.hauge.rocks to the app's loopback-only port (see
# apache/muster.conf). No proxy container in this stack.
#
# Database: the HOST's central MariaDB — no db container in prod (local dev
# uses the throwaway container in compose.dev.yaml). app + migrate run with
# host networking so they reach MariaDB on 127.0.0.1:3306 as the
# localhost-restricted `musteru` account; MariaDB itself needs no config
# changes and never listens beyond loopback.

services:
  # One-shot: applies pending migrations, then exits. The app waits for it.
  migrate:
    build:
      context: .
      target: builder
      secrets:
        - fa_token
    command: npx drizzle-kit migrate
    network_mode: host
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    restart: "no"

  app:
    build:
      context: .
      target: runner
      secrets:
        - fa_token
    restart: unless-stopped
    # Host networking: shares the host network namespace so 127.0.0.1 IS the
    # host — that's how it reaches the central MariaDB as the localhost-only
    # `musteru` account without any MariaDB/bind-address/grant changes (and
    # without coupling MariaDB startup to Docker's, which a bridge-gateway
    # setup would require). HOSTNAME below pins Next to loopback so :3000 is
    # never reachable from outside; only the host Apache proxy sees it.
    network_mode: host
    # The runner image already runs as non-root (USER nextjs). Drop all Linux
    # capabilities and lock the root filesystem read-only; the standalone Next
    # server only needs a writable /tmp. If a first boot ever fails writing
    # elsewhere, widen the tmpfs list rather than removing read_only.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # Bind Next to loopback (the image default is 0.0.0.0, which under host
      # networking would expose :3000 publicly). Do not remove.
      HOSTNAME: 127.0.0.1
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      # Secrets-at-rest key (Drive refresh token) + proof destination folder.
      # Required here so prod can never silently fall back to the committed
      # dev key or drop proofs into the admin's My Drive root (see env.ts).
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      DRIVE_FOLDER_ID: ${DRIVE_FOLDER_ID:?set DRIVE_FOLDER_ID in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Probes /api/health (app ↔ DB round-trip); `docker ps` shows unhealthy at
    # a glance during unattended operation. busybox wget ships in node:alpine.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# Build-time secret: the Font Awesome Pro Kit install token. Its value is read
# from FONTAWESOME_PACKAGE_TOKEN in the .env beside this file and mounted into
# the `deps` stage's `npm ci` (see Dockerfile). It is NOT passed to any running
# container — install-time only.
secrets:
  fa_token:
    environment: FONTAWESOME_PACKAGE_TOKEN
